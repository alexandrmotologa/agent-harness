<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHarness Studio — Decision DAG Inspector</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-yellow: #eab308;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.2rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    select, button, input { background: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
    button { cursor: pointer; background: #2563eb; border: none; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .main-layout { display: flex; flex: 1; height: calc(100vh - 60px); }
    #cy-canvas { flex: 1; height: 100%; background: #090d16; }
    .sidebar { width: 420px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { padding: 16px; flex: 1; overflow-y: auto; font-size: 0.9rem; line-height: 1.5; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .badge-GOAL { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .badge-THOUGHT { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
    .badge-TOOL_CALL { background: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
    .badge-OBSERVATION { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-FINAL_ANSWER { background: rgba(16, 185, 129, 0.3); color: #34d399; border: 1px solid #34d399; }
    .badge-INTERVENTION { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .meta-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .meta-label { color: var(--text-muted); }
    pre { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-top: 8px; overflow-x: auto; font-family: monospace; font-size: 0.82rem; color: #cbd5e1; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; width: 480px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      AgentHarness Studio
    </div>
    <div class="nav-actions">
      <select id="run-select" onchange="loadSelectedRun()"><option value="">Loading runs...</option></select>
      <button class="secondary" onclick="fitGraph()">Fit Graph</button>
      <button onclick="openRewindModal()">Rewind &amp; Branch</button>
    </div>
  </header>

  <div class="main-layout">
    <div id="cy-canvas"></div>
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Step Inspector</span>
        <span id="selected-branch" style="color: var(--text-muted); font-size: 0.8rem;">Branch: main</span>
      </div>
      <div class="sidebar-content" id="inspector-body">
        <p style="color: var(--text-muted);">Click on any node in the decision graph to inspect its parameters, thoughts, and sandbox results.</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="rewind-modal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">Time-Travel Rewind &amp; Branch</h3>
      <p style="color: var(--text-muted); margin-bottom: 16px; font-size: 0.85rem;">
        Rewind workspace filesystem to selected checkpoint, inject a corrected prompt, and continue execution.
      </p>
      <label style="font-size: 0.85rem; color: var(--text-muted);">Target Step or Node ID:</label>
      <input type="text" id="rewind-target" style="width: 100%; margin: 6px 0 16px 0;" placeholder="e.g. 2 or node_abc123">
      <label style="font-size: 0.85rem; color: var(--text-muted);">Modified Instruction / Prompt:</label>
      <textarea id="rewind-prompt" rows="4" style="width: 100%; background: #0f172a; color: white; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; margin: 6px 0 16px 0;" placeholder="e.g. Parse using regex instead of splitting by space..."></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="secondary" onclick="closeRewindModal()">Cancel</button>
        <button onclick="submitRewind()">Fork Branch</button>
      </div>
    </div>
  </div>

  <script>
    let cy = null;
    let currentDag = null;
    let selectedNodeData = null;

    async function fetchRuns() {
      try {
        const res = await fetch('/api/runs');
        const runs = await res.json();
        const select = document.getElementById('run-select');
        select.innerHTML = '';
        if (!runs.length) {
          select.innerHTML = '<option value="">No runs found</option>';
          return;
        }
        runs.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.run_id;
          opt.textContent = `${r.run_id} (${r.step_count} steps) — ${r.goal.substring(0, 30)}...`;
          select.appendChild(opt);
        });
        loadSelectedRun();
      } catch (err) {
        console.error('Error fetching runs:', err);
      }
    }

    async function loadSelectedRun() {
      const runId = document.getElementById('run-select').value;
      if (!runId) return;
      try {
        const res = await fetch(`/api/runs/${runId}/dag`);
        currentDag = await res.json();
        renderCytoscape(currentDag.cytoscape_elements);
      } catch (err) {
        console.error('Error loading DAG:', err);
      }
    }

    function renderCytoscape(elements) {
      if (cy) cy.destroy();

      cy = cytoscape({
        container: document.getElementById('cy-canvas'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'color': '#ffffff',
              'font-size': '11px',
              'text-valign': 'bottom',
              'text-margin-y': 6,
              'background-color': '#475569',
              'width': 36,
              'height': 36,
              'border-width': 2,
              'border-color': '#64748b'
            }
          },
          {
            selector: 'node[type = "GOAL"]',
            style: { 'background-color': '#0891b2', 'border-color': '#06b6d4' }
          },
          {
            selector: 'node[type = "THOUGHT"]',
            style: { 'background-color': '#2563eb', 'border-color': '#3b82f6' }
          },
          {
            selector: 'node[type = "TOOL_CALL"]',
            style: { 'background-color': '#ca8a04', 'border-color': '#eab308' }
          },
          {
            selector: 'node[type = "OBSERVATION"]',
            style: { 'background-color': '#059669', 'border-color': '#10b981' }
          },
          {
            selector: 'node[type = "FINAL_ANSWER"]',
            style: { 'background-color': '#047857', 'border-color': '#34d399', 'width': 44, 'height': 44 }
          },
          {
            selector: 'node[type = "INTERVENTION"]',
            style: { 'background-color': '#7c3aed', 'border-color': '#a855f7' }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#475569',
              'target-arrow-color': '#475569',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier'
            }
          }
        ],
        layout: {
          name: 'dagre',
          rankDir: 'TB',
          nodeSep: 50,
          rankSep: 80
        }
      });

      cy.on('tap', 'node', function(evt) {
        const node = evt.target;
        const nodeId = node.id();
        const fullNode = currentDag.nodes.find(n => n.id === nodeId);
        if (fullNode) {
          selectedNodeData = fullNode;
          showNodeDetails(fullNode);
        }
      });
    }

    function showNodeDetails(node) {
      document.getElementById('selected-branch').textContent = `Branch: ${node.branch_id}`;
      const body = document.getElementById('inspector-body');
      body.innerHTML = `
        <div class="badge badge-${node.node_type}">${node.node_type}</div>
        <h3 style="margin-bottom: 12px;">${node.title || 'Step Details'}</h3>
        <div class="meta-row"><span class="meta-label">Step Index</span><span>#${node.step_index}</span></div>
        <div class="meta-row"><span class="meta-label">Node ID</span><span style="font-family: monospace;">${node.id}</span></div>
        <div class="meta-row"><span class="meta-label">Content Hash</span><span style="font-family: monospace;">${node.content_hash ? node.content_hash.substring(0, 16) + '...' : 'N/A'}</span></div>
        <div class="meta-row"><span class="meta-label">Checkpoint</span><span>${node.checkpoint_id || 'None'}</span></div>
        <div class="meta-row"><span class="meta-label">Token Spend</span><span>${node.token_usage} tokens ($${node.cost_usd.toFixed(4)})</span></div>
        <div style="margin-top: 16px;">
          <div class="meta-label" style="margin-bottom: 4px;">Payload Data</div>
          <pre>${escapeHtml(JSON.stringify(node.payload, null, 2))}</pre>
        </div>
      `;
    }

    function fitGraph() {
      if (cy) cy.fit(null, 50);
    }

    function openRewindModal() {
      if (selectedNodeData) {
        document.getElementById('rewind-target').value = selectedNodeData.step_index;
      }
      document.getElementById('rewind-modal').style.display = 'flex';
    }

    function closeRewindModal() {
      document.getElementById('rewind-modal').style.display = 'none';
    }

    async function submitRewind() {
      const runId = document.getElementById('run-select').value;
      const target = document.getElementById('rewind-target').value;
      const prompt = document.getElementById('rewind-prompt').value;

      try {
        const res = await fetch(`/api/runs/${runId}/rewind`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            step_or_node_id: isNaN(target) ? target : parseInt(target, 10),
            new_prompt: prompt
          })
        });
        const data = await res.json();
        closeRewindModal();
        alert(`Rewound successfully! New branch '${data.branch_id}' created.`);
        loadSelectedRun();
      } catch (err) {
        alert('Rewind failed: ' + err);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.onload = fetchRuns;
  </script>
</body>
</html>
