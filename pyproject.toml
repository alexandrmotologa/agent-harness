[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Sandboxed multi-agent runtime and time-travel inspector with zero-trust execution and immutable decision DAGs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Alexandr Motologa" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "networkx>=3.3",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
wasm = ["wasmtime>=21.0.0"]
docker = ["docker>=7.0.0"]
anthropic = ["anthropic>=0.28.0"]
openai = ["openai>=1.30.0"]
all = [
    "docker>=7.0.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
]

[project.scripts]
agent-harness = "agent_harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
